name: Delete expired temporary collections
on:
  schedule:
    # Once daily at 02:17 UTC (04:17 EET / 05:17 EEST).
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: expired-collections-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Delete only collections whose server expiry has passed
        run: >-
          curl --fail-with-body --silent --show-error
          --retry 2 --max-time 60 --request POST
          'https://riigikogu-arvamuste-otsing.vivaciousacorn1.chatgpt.site/api/collections/cleanup'
